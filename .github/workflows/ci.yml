name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two compilers, because a bug can be invisible under one of them.
  linux:
    name: linux (${{ matrix.cc }})
    runs-on: ubuntu-latest
    # A hung step (seen: apt-get for 6 h) fails here instead of
    # running into GitHub's 6-hour limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      # ctt is fetched at configure time, so this needs network.
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  # ASan + UBSan + LeakSanitizer.  arena has no sanitizer option of its own,
  # so the flags go in through CMAKE_C_FLAGS.
  asan:
    name: linux (asan)
    runs-on: ubuntu-latest
    # A hung step (seen: apt-get for 6 h) fails here instead of
    # running into GitHub's 6-hour limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      # The runner kernel randomises 32 bits of mmap addresses; the sanitizer
      # runtimes assume fewer and abort with "unexpected memory mapping".
      - name: Reduce mmap randomisation for the sanitizers
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        env:
          CC: clang
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure --no-tests=error

  # MSVC itself and clang-cl, both against the MSVC headers and libraries
  # (VirtualAlloc backend).  setup-msvc-dev puts the MSVC environment on PATH.
  windows:
    name: windows (${{ matrix.cc }})
    runs-on: windows-latest
    # A hung step (seen: apt-get for 6 h) fails here instead of
    # running into GitHub's 6-hour limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cc: [cl, clang-cl]
    steps:
      - uses: actions/checkout@v7

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=${{ matrix.cc }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  macos:
    name: macos (clang)
    runs-on: macos-latest
    # A hung step (seen: apt-get for 6 h) fails here instead of
    # running into GitHub's 6-hour limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
